map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api      { server api:3000; }
upstream frontend { server frontend:5173; }

server {
    listen 80;

    # ── API (todos os endpoints REST) ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Bull Board (embutido no Fastify em /queues) ────────────────────────────
    location /queues {
        proxy_pass       http://api;
        proxy_set_header Host $host;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://api;
    }

    # ── Vite HMR WebSocket (path explícito para evitar conflito com /:slug) ──
    location = /_vite_ws {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $host;
    }

    # ── Assets internos do Vite ───────────────────────────────────────────────
    location ~ ^/(@vite|@fs|node_modules|__vite_ping) {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # ── Raiz: tenta /:slug no backend primeiro; 404 → SPA ────────────────────
    # Válido para: redirecionamentos de slug (→ 302) e rotas Vue (→ 404 → SPA)
    location / {
        proxy_pass            http://api;
        proxy_intercept_errors on;
        error_page 404        = @spa;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Fallback SPA ──────────────────────────────────────────────────────────
    location @spa {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }
}
