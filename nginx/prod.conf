upstream api      { server api:3000; }
upstream frontend { server frontend:80; }

server {
    listen 80;

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Bull Board ────────────────────────────────────────────────────────────
    location /queues {
        proxy_pass       http://api;
        proxy_set_header Host $host;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://api;
    }

    # ── Slug redirect + fallback SPA ──────────────────────────────────────────
    # Tenta o slug no backend (→ 302); se 404, entrega o SPA estático
    location / {
        proxy_pass              http://api;
        proxy_intercept_errors  on;
        error_page 404          = @spa;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # ── Fallback: frontend estático ───────────────────────────────────────────
    location @spa {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
    }
}
